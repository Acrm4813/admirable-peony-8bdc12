<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger – your finances in one place</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#14213d;--muted:#5d6b82;--line:#d9dfe8;--pos:#0b7a5f;--neg:#c23b4e;--accent:#14213d;--accent-ink:#fff;--bar:#9fb3d1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--surface:#171f33;--ink:#e8edf6;--muted:#93a1ba;--line:#2a3550;--pos:#43c9a1;--neg:#ff7a8c;--accent:#e8edf6;--accent-ink:#0e1320;--bar:#4a6290;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--surface:#171f33;--ink:#e8edf6;--muted:#93a1ba;--line:#2a3550;--pos:#43c9a1;--neg:#ff7a8c;--accent:#e8edf6;--accent-ink:#0e1320;--bar:#4a6290;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.1rem;margin:0;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:9px 8px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
.hero{padding:8px 0 24px}
.hero small{color:var(--muted);font-size:.95rem}
.big{font-size:clamp(2.4rem,9vw,3.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:2px 0 0}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:.95rem;margin:0 0 12px;font-weight:700}
.stat{font-size:1.5rem;font-weight:700}
.stat-l{color:var(--muted);font-size:.85rem}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .m{color:var(--muted);font-size:.85rem}
.bar{height:8px;border-radius:4px;background:var(--bar);min-width:2px}
.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.alloc i{display:block;background:var(--pos)}.alloc i+i{background:var(--bar)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500;padding:6px 10px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:right;padding:9px 6px;border-top:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:500;border-top:0}
th:first-child,td:first-child{text-align:left}
td input{width:90px;padding:5px 8px;text-align:right}
.note{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.empty{color:var(--muted);padding:10px 0}
.msg{min-height:1.3em;margin:8px 0 0;font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Ledger</h1><button class="btn ghost" id="reset">Reset data</button></header>
<nav role="tablist">
<button role="tab" data-tab="overview" aria-selected="true">Overview</button>
<button role="tab" data-tab="money" aria-selected="false">Income &amp; spending</button>
<button role="tab" data-tab="invest" aria-selected="false">Investments</button>
</nav>
<section id="overview"></section>
<section id="money" hidden></section>
<section id="invest" hidden></section>
</main>
<script>
var KEY="ledger-v1";
var CATS=["Salary","Freelance","Housing","Food","Transport","Bills","Health","Fun","Other"];
var S={tx:[],trades:[],prices:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.tx)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function usd(n){return(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function holdings(){
  var h={};
  S.trades.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){
    var x=h[t.sym]||(h[t.sym]={sym:t.sym,qty:0,cost:0,last:t.price});
    if(t.side==="buy"){x.qty+=t.qty;x.cost+=t.qty*t.price}
    else{var avg=x.qty?x.cost/x.qty:0;x.qty-=t.qty;x.cost-=avg*t.qty}
    x.last=t.price;
  });
  return Object.keys(h).map(function(k){var x=h[k];x.price=S.prices[k]!=null?S.prices[k]:x.last;x.value=x.qty*x.price;return x}).filter(function(x){return x.qty>1e-9});
}
function cash(){
  var c=0;
  S.tx.forEach(function(t){c+=t.type==="income"?t.amt:-t.amt});
  S.trades.forEach(function(t){c+=(t.side==="buy"?-1:1)*t.qty*t.price});
  return c;
}
function monthTx(){var m=today().slice(0,7);return S.tx.filter(function(t){return t.date.slice(0,7)===m})}

function renderOverview(){
  var hs=holdings(),inv=hs.reduce(function(a,h){return a+h.value},0),cb=cash(),nw=cb+inv;
  var mt=monthTx(),inc=0,exp=0,by={};
  mt.forEach(function(t){if(t.type==="income")inc+=t.amt;else{exp+=t.amt;by[t.cat]=(by[t.cat]||0)+t.amt}});
  var costAll=hs.reduce(function(a,h){return a+h.cost},0),pl=inv-costAll;
  var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),mx=cats.length?by[cats[0]]:1;
  var pctInv=nw>0?Math.max(0,Math.min(100,inv/nw*100)):0;
  $("overview").innerHTML=
   '<div class="hero"><small>Net worth</small><div class="big">'+usd(nw)+'</div></div>'+
   '<div class="split">'+
   '<div class="panel"><div class="stat-l">Cash</div><div class="stat">'+usd(cb)+'</div></div>'+
   '<div class="panel"><div class="stat-l">Invested (market value)</div><div class="stat">'+usd(inv)+'</div><div class="stat-l '+(pl>=0?"pos":"neg")+'">'+(pl>=0?"+":"")+usd(pl)+' unrealized</div></div>'+
   '<div class="panel"><div class="stat-l">This month</div><div class="stat '+(inc-exp>=0?"pos":"neg")+'">'+usd(inc-exp)+'</div><div class="stat-l">'+usd(inc)+' in, '+usd(exp)+' out</div></div></div>'+
   '<div class="panel" style="margin-bottom:12px"><h2>Where your money sits</h2><div class="alloc" role="img" aria-label="'+pctInv.toFixed(0)+' percent invested"><i style="width:'+(100-pctInv)+'%"></i><i style="width:'+pctInv+'%"></i></div><p class="note">'+(100-pctInv).toFixed(0)+'% cash, '+pctInv.toFixed(0)+'% invested</p></div>'+
   '<div class="panel"><h2>Spending this month</h2>'+(cats.length?cats.map(function(c){return '<div class="row"><span>'+esc(c)+'</span><div class="bar" style="width:'+(by[c]/mx*100)+'%"></div><b>'+usd(by[c])+'</b></div>'}).join(""):'<div class="empty">No spending logged yet. Add your first expense under Income &amp; spending.</div>')+'</div>';
}

function renderMoney(){
  var opts=CATS.map(function(c){return '<option>'+c+'</option>'}).join("");
  var list=S.tx.slice().sort(function(a,b){return a.date<b.date?1:-1});
  $("money").innerHTML=
   '<div class="panel" style="margin-bottom:12px"><h2>Add a transaction</h2><form id="txf">'+
   '<label>Type<select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label>'+
   '<label>Amount<input name="amt" type="number" step="0.01" min="0.01" required></label>'+
   '<label>Category<select name="cat">'+opts+'</select></label>'+
   '<label>Date<input name="date" type="date" value="'+today()+'" required></label>'+
   '<label>Note<input name="note" maxlength="60"></label>'+
   '<button class="btn" type="submit">Add</button></form></div>'+
   '<div class="panel"><h2>History</h2>'+(list.length?list.map(function(t){return '<div class="row" style="grid-template-columns:90px 1fr auto auto"><span class="m">'+t.date+'</span><span>'+esc(t.cat)+(t.note?' <span class="m">'+esc(t.note)+'</span>':'')+'</span><b class="'+(t.type==="income"?"pos":"")+'">'+(t.type==="income"?"+":"-")+usd(t.amt)+'</b><button class="x" data-del="'+t.id+'" aria-label="Delete transaction">×</button></div>'}).join(""):'<div class="empty">Nothing here yet. Log a paycheck or an expense above.</div>')+'</div>';
  $("txf").onsubmit=function(e){
    e.preventDefault();var f=new FormData(e.target),a=parseFloat(f.get("amt"));
    if(!(a>0))return;
    S.tx.push({id:uid(),type:f.get("type"),amt:a,cat:f.get("cat"),date:f.get("date"),note:f.get("note")});
    save();renderAll();
  };
  Array.prototype.forEach.call($("money").querySelectorAll("[data-del]"),function(b){b.onclick=function(){S.tx=S.tx.filter(function(t){return t.id!==b.dataset.del});save();renderAll()}});
}

var investMsg="";
function renderInvest(){
  var hs=holdings();
  $("invest").innerHTML=
   '<div class="panel" style="margin-bottom:12px"><h2>Practice trade</h2><form id="trf">'+
   '<label>Action<select name="side"><option value="buy">Buy</option><option value="sell">Sell</option></select></label>'+
   '<label>Symbol<input name="sym" maxlength="10" placeholder="VTI" required></label>'+
   '<label>Shares<input name="qty" type="number" step="any" min="0.0001" required></label>'+
   '<label>Price per share<input name="price" type="number" step="0.01" min="0.01" required></label>'+
   '<button class="btn" type="submit">Place trade</button></form>'+
   '<p class="msg" id="trmsg" role="status">'+investMsg+'</p>'+
   '<p class="note">Available cash: '+usd(cash())+'. This is a tracker: it records trades you enter and can’t place real orders. Use your broker to trade, then log it here.</p></div>'+
   '<div class="panel"><h2>Holdings</h2>'+(hs.length?'<div class="scroll"><table><thead><tr><th>Symbol</th><th>Shares</th><th>Avg cost</th><th>Price</th><th>Value</th><th>Gain/loss</th></tr></thead><tbody>'+hs.map(function(h){var g=h.value-h.cost;return '<tr><td><b>'+esc(h.sym)+'</b></td><td>'+(+h.qty.toFixed(4))+'</td><td>'+usd(h.cost/h.qty)+'</td><td><input type="number" step="0.01" min="0" value="'+h.price+'" data-price="'+esc(h.sym)+'" aria-label="Current price of '+esc(h.sym)+'"></td><td>'+usd(h.value)+'</td><td class="'+(g>=0?"pos":"neg")+'">'+(g>=0?"+":"")+usd(g)+'</td></tr>'}).join("")+'</tbody></table></div><p class="note">Edit a price to update the market value.</p>':'<div class="empty">No holdings yet. Place your first trade above.</div>')+'</div>';
  $("trf").onsubmit=function(e){
    e.preventDefault();var f=new FormData(e.target);
    var side=f.get("side"),sym=String(f.get("sym")).trim().toUpperCase(),qty=parseFloat(f.get("qty")),price=parseFloat(f.get("price"));
    if(!sym||!(qty>0)||!(price>0))return;
    if(side==="buy"&&qty*price>cash()+0.005){investMsg='<span class="neg">Not enough cash. Add income first, or buy fewer shares.</span>';renderInvest();return}
    if(side==="sell"){var h=holdings().filter(function(x){return x.sym===sym})[0];if(!h||h.qty+1e-9<qty){investMsg='<span class="neg">You hold '+(h?+h.qty.toFixed(4):0)+' shares of '+esc(sym)+'.</span>';renderInvest();return}}
    S.trades.push({id:uid(),date:today(),side:side,sym:sym,qty:qty,price:price});
    S.prices[sym]=price;investMsg='<span class="pos">'+(side==="buy"?"Bought ":"Sold ")+qty+' '+esc(sym)+' at '+usd(price)+'.</span>';
    save();renderAll();
  };
  Array.prototype.forEach.call($("invest").querySelectorAll("[data-price]"),function(i){i.onchange=function(){var v=parseFloat(i.value);if(v>=0){S.prices[i.dataset.price]=v;save();investMsg="";renderAll()}}});
}

function renderAll(){renderOverview();renderMoney();renderInvest()}
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
  b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(x){x.setAttribute("aria-selected",x===b)});
    ["overview","money","invest"].forEach(function(id){$(id).hidden=id!==b.dataset.tab});
  };
});
$("reset").onclick=function(){
  if(this.dataset.armed){S={tx:[],trades:[],prices:{}};save();investMsg="";renderAll();this.textContent="Reset data";delete this.dataset.armed}
  else{this.dataset.armed="1";this.textContent="Tap again to erase everything";var t=this;setTimeout(function(){delete t.dataset.armed;t.textContent="Reset data"},3500)}
};
renderAll();
</script>
</body>
</html>
